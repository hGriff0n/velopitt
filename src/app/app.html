<app-header (menuToggled)="drawer.toggle()"></app-header>
<mat-drawer-container class="example-container" autosize [hasBackdrop]="true">
  <div class="map" style="height:100%; width:100%;">
    <app-map [regionShowing]="regionShowing()" [segmentShowing]="segmentShowing()" [bikemapShowing]="bikemapShowing()"
      [bikemapPlusShowing]="bikemapPlusShowing()" [rideStartsShowing]="rideStartsShowing()"
      [selectedSegmentId]="selectedSegment()" (segmentSelected)="onSegmentSelected($event)"
      (mapLoaded)="onMapLoaded($event)">
    </app-map>
  </div>

  <!-- Drawer slides over the map -->
  <mat-drawer #drawer class="example-sidenav" mode="over">
    <app-sidebar [regionShowing]="regionShowing()" [segmentShowing]="segmentShowing()"
      [bikemapShowing]="bikemapShowing()" [bikemapPlusShowing]="bikemapPlusShowing()"
      [rideStartsShowing]="rideStartsShowing()" (toggleRegion)="toggleRegionLayer()"
      (toggleSegment)="toggleSegmentLayer()" (toggleBikeMap)="toggleBikeNetwork()" (toggleBikePlus)="toggleBikePlus()"
      (toggleRideStarts)="toggleRideStarts()"></app-sidebar>
  </mat-drawer>

  <segment-overlay [segment]="segment.getSegmentByDomId(selectedSegment())"
    [style.display]="isShow() ? 'block' : 'none'" (closeOverlay)="onSegmentSelected(-1)"></segment-overlay>
  <router-outlet />
</mat-drawer-container>
