<mat-drawer-container class="example-container" autosize [hasBackdrop]="true">
  <div class="map" style="height:100vh; width:100%;">
    <mgl-map [style]="'mapbox://styles/hgriff0n/cmds2q1t100u101s2063wbeh6'" [zoom]="15" [center]="[-79.997, 40.44]"
      [interactive]="true" [maxZoom]=31 [bearing]="90" [pitch]="70" (mapLoad)="onLoad($event)">
    </mgl-map>
  </div>

  <!-- Putting this before the map makes it render underneath -->
  <mat-drawer #drawer class="example-sidenav" mode="side">
    <p>Auto-resizing sidenav</p>
  </mat-drawer>
  <button class="float" (click)="drawer.toggle()" style="top: 1%; left: 1%"
    matMiniFab><mat-icon>menu</mat-icon></button>

  <pre id="segment_display" style="top:0%;left:0%;position:absolute;">
    @if (isShow) {
      <div id="segment_info" class="segment_popup"><p>Segment Info</p></div>
      <div id="elevation_profile" class="segment_popup"><p>Elevation Profile</p></div>
      <div id="pacing_calculator" class="segment_popup"><p>Pacing Calculator</p></div>
      <div id="related_segments" class="segment_popup"><p>Related Segments</p></div>
    }
  </pre>
</mat-drawer-container>
<router-outlet />
