<mat-toolbar style="background-color: black;">
  <button mat-icon-button (click)="drawer.toggle()"><mat-icon>menu</mat-icon></button>
</mat-toolbar>
<mat-drawer-container class="example-container" autosize [hasBackdrop]="true">
  <div class="map" style="height:100%; width:100%;">
    <mgl-map [style]="'mapbox://styles/hgriff0n/cmds2q1t100u101s2063wbeh6'" [zoom]="15" [center]="[-79.997, 40.44]"
      [interactive]="true" [maxZoom]=31 [bearing]="90" [pitch]="70" (mapLoad)="onLoad($event)">
    </mgl-map>
  </div>

  <!-- TODO: me - Figure out how to keep map interactivity with drawer open -->
  <mat-drawer #drawer class="example-sidenav" mode="side">
  <!-- <mat-drawer #drawer class="example-sidenav" mode="over"> -->
    <mat-action-list>
      <button mat-list-item [class.active-button]="!regionShowing" (click)="toggleRegionLayer()">Toggle region layer</button>
      <button mat-list-item [class.active-button]="!segmentShowing" (click)="toggleSegmentLayer()">Toggle segment layer</button>
      <mat-divider></mat-divider>
      <button routerLink="/" mat-list-item>Group Rides + Events</button>
      <button routerLink="/" mat-list-item>Community Resources</button>
      <button routerLink="/" mat-list-item>Route Builder</button>
    </mat-action-list>
  </mat-drawer>

  <!-- TODO: me - Visibility toggle currently relies on change detection which isn't triggered across the component -->
  @if (isShow) {
  <segment-overlay [visible]="isShow" [segment_id]="selectedSegment"></segment-overlay>
  }
</mat-drawer-container>
<router-outlet />
